<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diomano</title>
    <!-- Inline, so the page makes exactly one request it did not ask for: none. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%232f6f8f'/%3E%3Cpath d='M6 18a10 10 0 0020 0z' fill='%233f8f5f'/%3E%3C/svg%3E"
    />
    <style>
      /*
        The hand is the interface (HANDOFF §8): cursor, matter carrier and
        influence indicator in one. §8 also says there is no HUD, and this file
        no longer honours that literally — see the header of `src/hud.ts` for
        what four questions the match could not answer without one, and PLAN.md
        for the recorded deviation. What is here:

          .overlay      the title and end cards, outside the match (§9.4)
          .radial       the power menu, alive only while right-click holds it
          .hud          three lines in a corner, plus transient markers
          #fallback     an epitaph, if WebGL2 or WebAssembly is missing

        Everything else is a full-bleed canvas and a black page behind the
        planet. Nothing in .hud takes a pointer event.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        /* The hand is the cursor. */
        cursor: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Touch and pen drive the same pointer events as the mouse. Without
           this the browser claims a drag for scrolling or pinch-zoom and sends
           the game a pointercancel in the middle of a sculpt or an orbit. */
        touch-action: none;
      }
      /*
        Shell UI (HANDOFF §9.4): the title card and the end card. They sit
        *outside* the match — the in-game screen stays empty — which is the
        one place §9.4 allows chrome. Plain DOM, system fonts, no assets.
      */
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 6, 12, 0.62);
        backdrop-filter: blur(2px);
        color: #e6e2d8;
        font:
          15px/1.65 system-ui,
          sans-serif;
        text-align: center;
        cursor: auto;
        opacity: 1;
        transition: opacity 600ms ease;
        z-index: 10;
      }
      .overlay.overlay-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .overlay h1 {
        font-size: 44px;
        letter-spacing: 0.14em;
        margin: 0 0 4px;
        font-weight: 300;
      }
      .overlay .premise {
        color: #a8b0c0;
        margin: 0 0 26px;
      }
      .overlay table {
        margin: 0 auto 26px;
        border-collapse: collapse;
        text-align: left;
        color: #c8cdd8;
      }
      .overlay td {
        padding: 3px 14px;
      }
      .overlay td:first-child {
        color: #ffe9c0;
        text-align: right;
        white-space: nowrap;
      }
      .overlay .hint {
        color: #8a93a8;
        animation: overlay-pulse 2.4s ease-in-out infinite;
      }
      .overlay button {
        background: none;
        border: 1px solid #5a6478;
        border-radius: 4px;
        color: #e6e2d8;
        font: inherit;
        padding: 8px 22px;
        margin: 0 8px;
        cursor: pointer;
      }
      .overlay button:hover {
        border-color: #ffe9c0;
        color: #ffe9c0;
      }
      @keyframes overlay-pulse {
        50% {
          opacity: 0.45;
        }
      }
      /*
        The radial power menu. A full-screen backdrop swallows every pointer
        event while it is open — a stray closing click must never leak through
        to the hand as a magnet placement — and the slices sit on a circle
        around the point that was right-clicked.

        The backdrop also *darkens* under the ring. It used to be fully
        transparent, and the menu was then least readable exactly where it is
        most used: opened over a sunlit coast, or over the hand's own cream palm
        and footprint ring, dark labels on 78%-opaque boxes sat against ground
        brighter than their own text. The scrim is centred on the open point
        (--cx / --cy, written by `openAt`) and fades out well before the edges,
        so the world stays visible and only the ring's own ground goes dark.
      */
      .radial {
        position: fixed;
        inset: 0;
        z-index: 5;
        cursor: auto;
        background: radial-gradient(
          circle 320px at var(--cx, 50%) var(--cy, 50%),
          rgba(4, 6, 12, 0.88),
          rgba(4, 6, 12, 0.62) 45%,
          rgba(4, 6, 12, 0.22) 78%,
          rgba(4, 6, 12, 0) 100%
        );
      }
      .radial-slice {
        position: absolute;
        transform: translate(-50%, -50%);
        background: rgba(8, 11, 18, 0.94);
        border: 1px solid #7a8494;
        border-radius: 6px;
        color: #f0ece2;
        font:
          500 15px/1.3 system-ui,
          sans-serif;
        text-align: center;
        padding: 9px 14px;
        min-width: 104px;
        cursor: pointer;
        user-select: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .radial-slice:hover {
        background: rgba(22, 28, 38, 0.96);
        border-color: #ffe9c0;
        color: #ffe9c0;
      }
      .radial-slice .cost {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: #b9c2d0;
      }
      .radial-slice .charge {
        color: #ffd75e;
      }
      /*
        Unaffordable, and still readable. This was `opacity: 0.38`, which took
        the box down with the text: over bright ground the whole slice
        disappeared, so the first thing to go was the one thing the player
        needed — what it costs, and how far off affording it they are. The box
        keeps its contrast now; only the label dims, and the price turns muted
        red to say why. Declared after `:hover` on purpose: equal specificity,
        so the later rule wins and hovering a slice you cannot pay for does not
        light it up as if you could.
      */
      .radial-slice.disabled {
        background: rgba(8, 11, 18, 0.94);
        border-color: #3a4250;
        color: #6b7484;
        cursor: not-allowed;
        text-shadow: none;
      }
      .radial-slice.disabled .cost {
        color: #a85c52;
      }
      .radial-slice.confirm {
        border-color: #ff6a2a;
        color: #ff6a2a;
      }
      .radial-hub {
        position: absolute;
        transform: translate(-50%, -50%);
        max-width: 200px;
        background: rgba(8, 11, 18, 0.88);
        border-radius: 12px;
        padding: 8px 12px;
        color: #d8dbe2;
        font:
          13px/1.45 system-ui,
          sans-serif;
        text-align: center;
        pointer-events: none;
      }
      .radial-hub .mods {
        color: #ffe9c0;
      }
      /*
        Mana, in the one place it can be shown without becoming chrome: the
        centre of a menu that exists only while it is held open. Every slice
        states a price, and without this the player had nothing to compare those
        prices against but the brightness of their own palm.
      */
      .radial-hub .mana {
        color: #ffd75e;
        margin-top: 5px;
      }
      /*
        The title card's one setting. The card starts the match on any
        pointerdown — `ui.ts` stops the slider's events before they reach it —
        so this control has to look like a control, or a player will drag the
        planet instead of the handle.
      */
      .overlay .volume {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin: 0 0 22px;
        color: #a8b0c0;
      }
      .overlay .volume input[type="range"] {
        width: 160px;
        accent-color: #ffe9c0;
        cursor: pointer;
      }
      .overlay .volume output {
        min-width: 3.4em;
        text-align: left;
        color: #c8cdd8;
        font-variant-numeric: tabular-nums;
      }

      /*
        The readouts. Three lines top-left, transient markers wherever an applied
        verb landed, a banner for the tide's phase changes and a coaching line at
        the bottom. Below .radial (5) and .overlay (10) in the stack, because a
        menu or a card owning the screen has to sit over this, and it never takes
        a pointer event at any depth.
      */
      .hud {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        font:
          13px/1.5 system-ui,
          sans-serif;
        transition: opacity 400ms ease;
      }
      .hud.hud-hidden {
        opacity: 0;
      }
      .hud-panel {
        position: absolute;
        top: 18px;
        left: 20px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      }
      .hud-mana {
        color: #a8b0c0;
        letter-spacing: 0.02em;
      }
      .hud-mana b {
        color: #ffd75e;
        font-size: 17px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .hud-tide {
        color: #a8b0c0;
        margin-top: 1px;
      }
      /* The wave is coming, or landing. The one place the panel raises its voice. */
      .hud-tide.warning {
        color: #ff9d5e;
      }
      /*
        Territory. The track is the opponent's colour and the fill is yours, so
        the bar is the whole standing rather than a fraction of an abstract
        maximum — the same warm/cool pair the terrain shader blends by influence
        (uGodA / uGodB in planet.ts), so the bar and the planet agree.
      */
      .hud-bar {
        width: 96px;
        height: 4px;
        margin-top: 7px;
        border-radius: 2px;
        background: #6e83ad;
        overflow: hidden;
      }
      .hud-bar i {
        display: block;
        height: 100%;
        width: 50%;
        background: #ffe9c0;
        transition: width 500ms ease;
      }
      /*
        What just happened, once, in the middle of the screen. §8 forbids a
        countdown and this is not one — it reports a phase change after the fact
        and fades.
      */
      .hud-banner {
        position: absolute;
        top: 22%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #e6e2d8;
        font-size: 21px;
        font-weight: 300;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        opacity: 0;
        transition: opacity 500ms ease;
      }
      .hud-banner.shown {
        opacity: 1;
      }
      /*
        One coaching line, retired the moment the player does the thing. It needs
        a carrier and not just a shadow: the bottom of the frame is where the
        camera puts the ground nearest the player, which is the brightest, most
        detailed part of the picture, and grey text with a drop shadow simply
        disappeared into a sunlit meadow.
      */
      .hud-hint {
        position: absolute;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(30em, 80vw);
        padding: 6px 14px;
        border-radius: 14px;
        background: rgba(8, 11, 18, 0.72);
        color: #c8cdd8;
        text-align: center;
        opacity: 0;
        transition: opacity 600ms ease;
      }
      .hud-hint.shown {
        opacity: 1;
      }
      /*
        The controls, on demand. §8's "no HUD" already carries a recorded
        deviation for the panel above; this is deliberately *not* a second
        permanent readout — it starts hidden, it is one keystroke away, and it
        remembers whichever the player chose. It is a reference card, not an
        instrument.

        Bottom-right rather than centre: the player asks for it mid-match, with
        a hand on the planet, and a centred panel would cover the ground they
        are working.
      */
      .hud-controls {
        position: absolute;
        right: 20px;
        bottom: 20px;
        padding: 12px 16px 13px;
        border-radius: 8px;
        background: rgba(8, 11, 18, 0.82);
        color: #c8cdd8;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 220ms ease,
          transform 220ms ease;
      }
      .hud-controls.shown {
        opacity: 1;
        transform: none;
      }
      .hud-controls table {
        border-collapse: collapse;
      }
      .hud-controls td {
        padding: 2px 0;
        vertical-align: baseline;
      }
      .hud-controls td:first-child {
        color: #ffe9c0;
        text-align: right;
        white-space: nowrap;
        padding-right: 12px;
      }
      .hud-controls .hud-controls-close {
        margin: 8px 0 0;
        color: #8a93a8;
        font-size: 12px;
      }
      /* Shown only if WebGL2 or WebAssembly is missing. Not UI: an epitaph. */
      #fallback {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #8a93a8;
        font: 14px/1.6 ui-monospace, monospace;
        text-align: center;
        padding: 2rem;
        cursor: auto;
        /* Above the HUD (4), the radial menu (5) and the shell cards (10): a
           simulation that trapped mid-match has to be legible over all of them. */
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <!--
      The title card is markup, not `innerHTML`, so it is on screen the moment
      the document parses — before the entry module runs, let alone the wasm or
      the three.js chunk. `ui.ts` adopts this element rather than building one;
      it fills the controls table from the single `CONTROLS` table in `verbs.ts`
      and swaps the hint once the game behind it is ready to start.
    -->
    <div class="overlay" id="title">
      <div>
        <h1>diomano</h1>
        <p class="premise">Zwei Götter, ein Planet. Wessen Volk übersteht die Flutwellen?</p>
        <table id="title-controls"></table>
        <p class="volume">
          <label for="volume">Lautstärke</label>
          <input id="volume" type="range" min="0" max="100" step="1" value="50" />
          <output for="volume">50%</output>
        </p>
        <p class="hint" id="title-hint">Lädt …</p>
      </div>
    </div>
    <div id="fallback"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
