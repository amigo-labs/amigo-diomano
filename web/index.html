<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diomano</title>
    <!-- Inline, so the page makes exactly one request it did not ask for: none. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%232f6f8f'/%3E%3Cpath d='M6 18a10 10 0 0020 0z' fill='%233f8f5f'/%3E%3C/svg%3E"
    />
    <style>
      /*
        There is no persistent HUD (HANDOFF §8). The god has no body, only a
        hand — cursor, matter carrier and influence indicator in one. The one
        transient in-match element is the radial power menu (.radial below),
        which exists only while its right-click holds it open; everything else
        here is a full-bleed canvas and a black page behind the planet.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        /* The hand is the cursor. */
        cursor: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /*
        Shell UI (HANDOFF §9.4): the title card and the end card. They sit
        *outside* the match — the in-game screen stays empty — which is the
        one place §9.4 allows chrome. Plain DOM, system fonts, no assets.
      */
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 6, 12, 0.62);
        backdrop-filter: blur(2px);
        color: #e6e2d8;
        font:
          15px/1.65 system-ui,
          sans-serif;
        text-align: center;
        cursor: auto;
        opacity: 1;
        transition: opacity 600ms ease;
        z-index: 10;
      }
      .overlay.overlay-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .overlay h1 {
        font-size: 44px;
        letter-spacing: 0.14em;
        margin: 0 0 4px;
        font-weight: 300;
      }
      .overlay .premise {
        color: #a8b0c0;
        margin: 0 0 26px;
      }
      .overlay table {
        margin: 0 auto 26px;
        border-collapse: collapse;
        text-align: left;
        color: #c8cdd8;
      }
      .overlay td {
        padding: 3px 14px;
      }
      .overlay td:first-child {
        color: #ffe9c0;
        text-align: right;
        white-space: nowrap;
      }
      .overlay .hint {
        color: #8a93a8;
        animation: overlay-pulse 2.4s ease-in-out infinite;
      }
      .overlay button {
        background: none;
        border: 1px solid #5a6478;
        border-radius: 4px;
        color: #e6e2d8;
        font: inherit;
        padding: 8px 22px;
        margin: 0 8px;
        cursor: pointer;
      }
      .overlay button:hover {
        border-color: #ffe9c0;
        color: #ffe9c0;
      }
      @keyframes overlay-pulse {
        50% {
          opacity: 0.45;
        }
      }
      /*
        The radial power menu. A full-screen backdrop swallows every pointer
        event while it is open — a stray closing click must never leak through
        to the hand as a magnet placement — and the slices sit on a circle
        around the point that was right-clicked.
      */
      .radial {
        position: fixed;
        inset: 0;
        z-index: 5;
        cursor: auto;
      }
      .radial-slice {
        position: absolute;
        transform: translate(-50%, -50%);
        background: rgba(4, 6, 12, 0.78);
        border: 1px solid #5a6478;
        border-radius: 6px;
        color: #e6e2d8;
        font:
          13px/1.35 system-ui,
          sans-serif;
        text-align: center;
        padding: 7px 12px;
        min-width: 86px;
        cursor: pointer;
        user-select: none;
      }
      .radial-slice:hover {
        border-color: #ffe9c0;
        color: #ffe9c0;
      }
      .radial-slice .cost {
        display: block;
        font-size: 11px;
        color: #a8b0c0;
      }
      .radial-slice .charge {
        color: #ffd75e;
      }
      .radial-slice.disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      .radial-slice.confirm {
        border-color: #ff6a2a;
        color: #ff6a2a;
      }
      .radial-hub {
        position: absolute;
        transform: translate(-50%, -50%);
        max-width: 190px;
        color: #a8b0c0;
        font:
          12px/1.45 system-ui,
          sans-serif;
        text-align: center;
        pointer-events: none;
      }
      .radial-hub .mods {
        color: #ffe9c0;
      }
      /* Shown only if WebGL2 or WebAssembly is missing. Not UI: an epitaph. */
      #fallback {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #8a93a8;
        font: 14px/1.6 ui-monospace, monospace;
        text-align: center;
        padding: 2rem;
        cursor: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="fallback"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
